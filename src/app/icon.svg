<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Task 21 (OG Images + Preview Metadata). The KINECT asterisk mark,
    recovered exactly from src/components/AsteriskMark.tsx's four
    stroke-width:3 round-capped lines (same 32x32 viewBox, same
    coordinates) as a standalone static SVG asset -- solid cyan fill on a
    transparent canvas, no gradient (design-reference/README.md "Assets ->
    Logo": "solid fills only; gradient marks were explicitly rejected").
    Cyan (#35D6E8) rather than the persona-variable `var(--accent)` the
    React component defaults to, since this file has no CSS custom
    property scope of its own -- it is the site-wide brand mark (favicon,
    JSON-LD Organization.logo, OG image lockup source-of-truth), not any
    one persona's accent.

    This file is duplicated (not symlinked) at src/app/icon.svg so Next's
    file-convention metadata icons pick it up automatically for
    <link rel="icon">; see that file's own doc comment for why a duplicate
    beats a re-export here.
  -->
  <g stroke="#35D6E8" stroke-width="3" stroke-linecap="round">
    <line x1="16" y1="4" x2="16" y2="28" />
    <line x1="4" y1="16" x2="28" y2="16" />
    <line x1="7.5" y1="7.5" x2="24.5" y2="24.5" />
    <line x1="24.5" y1="7.5" x2="7.5" y2="24.5" />
  </g>
</svg>
